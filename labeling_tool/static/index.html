<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YOLO 라벨링 툴</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>YOLO 라벨링 툴</h1>
      <div class="dir-select">
        <label for="dirSelect">디렉터리</label>
        <select id="dirSelect"></select>
        <button id="refreshDirs" title="목록 새로고침">⟳</button>
      </div>
      <div class="progress" id="progressText"></div>
    </header>

    <main>
      <aside id="sidebar">
        <div class="class-panel">
          <div class="class-title">클래스</div>
          <button class="class-btn" data-cls="0" style="--c:#2ecc71">1. safety</button>
          <button class="class-btn" data-cls="1" style="--c:#e74c3c">2. danger</button>
          <button class="class-btn" data-cls="2" style="--c:#f39c12">3. corn</button>
        </div>
        <div class="image-list-title">이미지 목록</div>
        <ul id="imageList"></ul>
      </aside>

      <section id="canvasArea">
        <div id="canvasWrap">
          <canvas id="canvas"></canvas>
        </div>
        <div id="toolbar">
          <button id="prevBtn">◀ 이전 (A)</button>
          <span id="fileLabel"></span>
          <button id="nextBtn">다음 (D) ▶</button>
          <button id="saveBtn">저장 (S)</button>
          <span id="statusMsg"></span>
        </div>
        <div class="box-list-title">현재 이미지 박스 목록 (Delete로 삭제)</div>
        <ul id="boxList"></ul>
      </section>
    </main>
  </div>
<script src="/app.js"></script>
</body>
</html>
